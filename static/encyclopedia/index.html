<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Indicators Encyclopedia</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sidebar-logo">
    <h1>Trading <em>Encyclopedia</em></h1>
    <p>NSE India — Complete Reference</p>
  </div>
  <div class="sidebar-stats">
    <div class="s-stat"><div class="s-stat-n" id="total-count">0</div><div class="s-stat-l">Items</div></div>
    <div class="s-stat"><div class="s-stat-n">9</div><div class="s-stat-l">Categories</div></div>
    <div class="s-stat"><div class="s-stat-n">3</div><div class="s-stat-l">Files</div></div>
  </div>
  <div id="nav-links"></div>
</nav>

<!-- MAIN -->
<div id="main">
  <div id="topbar">
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="text" placeholder="Search indicators, strategies, filters…">
    </div>
    <div class="filter-pills" id="filter-pills"></div>
  </div>

  <div id="content">
    <div id="empty"><div class="empty-title">Nothing found</div><p>Try a different search term</p></div>
    <div id="sections"></div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <button class="modal-close" id="modal-close">✕</button>
      <div class="modal-badge" id="modal-badge"></div>
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-subtitle" id="modal-subtitle"></div>
      <div class="modal-tags" id="modal-tags"></div>
    </div>
    <div class="modal-body">
      <div class="modal-tabs" id="modal-tabs"></div>
      <div id="modal-content"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="data.js"></script>
<script src="data_part3.js"></script>
<script src="data_glossary.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
